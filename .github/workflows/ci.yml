name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUN_TRANSLATION_LLM_SMOKE: "0"

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FFMPEG_PACKAGE_VERSION: "7:6.1.1-3ubuntu5"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
          enable-cache: true
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Install pinned media test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "ffmpeg=${FFMPEG_PACKAGE_VERSION}"
          ffmpeg -version
          ffprobe -version
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: PostgreSQL, Garage, and migration integration tests
        run: make test-integration

  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  compose:
    name: Compose definition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate local topology without starting services
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - name: Validate observability topology
        run: |
          docker compose --env-file .env.example \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml \
            config --quiet
      - name: Verify paid provider smoke tests remain disabled
        run: test "$RUN_TRANSLATION_LLM_SMOKE" = "0"

  publish:
    name: Publish ${{ matrix.image }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-
      - name: Build and publish immutable multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
