name: Phase 6 web wiring

on:
  push:
    branches: [dev/render-export]

permissions:
  contents: write

concurrency:
  group: phase6-web-wiring
  cancel-in-progress: true

jobs:
  wire-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Wire speech and render surfaces
        run: python scripts/phase6_web_wire.py
      - name: Verify web candidate
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit verified web wiring and remove helper
        run: |
          rm scripts/phase6_web_wire.py .github/workflows/phase6-web-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(render): wire speech and render review surfaces"
          git push
