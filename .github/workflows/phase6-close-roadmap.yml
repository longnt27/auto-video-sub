name: Phase 6 roadmap closure

on:
  push:
    branches: [dev/render-export]

permissions:
  contents: write

concurrency:
  group: phase6-roadmap-closure
  cancel-in-progress: true

jobs:
  close-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Update execution roadmap
        run: python scripts/phase6_close_roadmap.py
      - name: Commit roadmap and remove helper
        run: |
          rm scripts/phase6_close_roadmap.py .github/workflows/phase6-close-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(roadmap): close Phase 6 implementation"
          git push
