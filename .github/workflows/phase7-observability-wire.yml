name: Phase 7 observability wiring

on:
  push:
    branches: [dev/observability-foundation]

permissions:
  contents: write

concurrency:
  group: phase7-observability-wiring
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
      - name: Apply telemetry wiring
        run: python scripts/phase7_observability_patch.py
      - name: Resolve locked Python dependencies
        run: uv lock
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Verify Python candidate
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run mypy
          uv run pytest packages/infrastructure/tests apps/api/tests
      - name: Verify observability topology
        run: |
          docker compose --env-file .env.example \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml \
            config --quiet
      - name: Commit candidate and remove helper
        run: |
          chmod +x scripts/smoke-observability.sh
          rm scripts/phase7_observability_patch.py .github/workflows/phase7-observability-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(observability): wire api telemetry foundation"
          git push
