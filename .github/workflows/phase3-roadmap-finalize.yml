name: Phase 3 roadmap finalize

on:
  pull_request:
    paths:
      - ".github/workflows/phase3-roadmap-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-roadmap:
    if: github.event.pull_request.head.ref == 'dev/source-transcript'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Mark Phase 3 complete and Phase 4 next
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/roadmap.md')
          text = path.read_text()
          replacements = {
              '| 3 — Source transcript | **Next** | Extract Chinese subtitle text into an editable, versioned transcript |':
                  '| 3 — Source transcript | Completed | Extract Chinese subtitle text into an editable, versioned transcript |',
              '| 4 — Translation | Planned | Produce and review Vietnamese subtitles with controlled paid translation |':
                  '| 4 — Translation | **Next** | Produce and review Vietnamese subtitles with controlled paid translation |',
              'Phase 2 is accepted as the current product baseline. Its provisional media limits remain configuration, not a reason to block Phase 3.':
                  'Phase 3 is accepted as the current product baseline. The next product implementation target is Phase 4 translation; Phase 2 media limits remain configuration.',
              '## Phase 3 — source transcript\n':
                  '## Phase 3 — source transcript — completed\n',
              '**Do not pull into Phase 3:** translation, tone controls, TTS, final rendering, arbitrary subtitle styling, or production observability expansion.':
                  '**Exit evidence:** source-transcript workflow/API/editor implementation, local RapidOCR runtime lock, provider/domain/application tests, and PostgreSQL/Garage/migration integration gates pass in CI.\n\n**Do not pull into Phase 3:** translation, tone controls, TTS, final rendering, arbitrary subtitle styling, or production observability expansion.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'roadmap marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove helper and push
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/phase3-roadmap-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(roadmap): complete phase 3"
          git push origin "HEAD:${HEAD_BRANCH}"
