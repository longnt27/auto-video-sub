name: Phase 5 finalize

on:
  push:
    branches: [dev/vietnamese-speech]

permissions:
  contents: write

concurrency:
  group: phase5-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
      - name: Update roadmap status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "| 5 — Vietnamese speech | **Next** | Produce fitted Vietnamese speech per translated segment |",
              "| 5 — Vietnamese speech | **In Progress** | Produce fitted Vietnamese speech per translated segment |",
          )
          text = text.replace(
              "Phase 4 is accepted as the current product baseline. The next product implementation target is Phase 5 Vietnamese speech and duration fitting. Phase 2 media limits remain configuration.",
              "Phase 4 remains the last closed product baseline. Phase 5 implementation is merged-ready but remains open until the exact VieNeu model revision and preset voice pass the offline arm64 promotion gate in `docs/phase5-promotion.md`. Phase 6 remains blocked. Phase 2 media limits remain configuration.",
          )
          marker = "**Goal:** generate local Vietnamese speech for each approved translated segment and fit it to the available timing without uncontrolled loops or semantic damage.\n"
          baseline = "\n".join(
              [
                  "",
                  "",
                  "**Implemented baseline:**",
                  "",
                  "- Local VieNeu v3 Turbo ONNX adapter with pinned local backbone and codec paths; model assets fail closed instead of being fetched at runtime.",
                  "- Immutable per-segment speech attempts with provider/model/revision/voice/policy lineage, raw/trimmed/fitted audio artifacts, deterministic idempotency, and selective invalidation when a translation revision or generation configuration changes.",
                  "- Deterministic fitting policy: generate -> trim edge silence -> measure -> bounded speed-up -> bounded local llama.cpp rewrite -> human review. No truncation and no unbounded regeneration loop.",
                  "- Durable `speech-fit-v1` Temporal workflow with segment-scoped retries, human review/approval signals, cancel behavior, and segment-level repair cycles.",
                  "- API and browser speech review surface for start/status, signed audio preview, sequence playback, attempt history, segment repair, approval, and cancellation.",
                  "- Phase 5 schema migration, local runtime configuration, read-only model mount, provider/domain/workflow/API/Web tests, and a reproducible `linux/arm64` promotion harness that runs with container networking disabled.",
                  "",
                  "**Automated evidence:** PR CI passes Python formatting/lint/mypy/full pytest/PostgreSQL+Garage+Alembic integration, Web format/lint/typecheck/tests/production build, and Compose validation. `uv.lock` is regenerated with uv 0.11.3 and pins the VieNeu runtime dependency.",
                  "",
                  "**Remaining promotion gate:** run `scripts/benchmark-phase5.sh` on the supported Apple Silicon host with the exact candidate model snapshot and voice, then complete the generated listening/content-integrity checklist. Until that evidence passes, Phase 5 is not closed and Phase 6 must not begin.",
                  "",
              ]
          )
          if "**Implemented baseline:**\n\n- Local VieNeu v3 Turbo ONNX adapter" not in text:
              if marker not in text:
                  raise SystemExit("Phase 5 goal marker not found")
              text = text.replace(marker, marker + baseline)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify Python promotion harness
        run: |
          uv sync --all-packages --all-groups --frozen
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff check .
          uv run mypy
          uv run pytest apps/worker/tests/test_phase5_promotion.py
          chmod +x scripts/benchmark-phase5.sh
      - name: Remove helper and commit
        run: |
          rm .github/workflows/phase5-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git update-index --chmod=+x scripts/benchmark-phase5.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(speech): record phase5 implementation gate"
          git push
