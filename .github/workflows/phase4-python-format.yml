name: Phase 4 Python finalize

on:
  push:
    branches: [dev/translation-review]
    paths: [.github/workflows/phase4-python-format.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev/translation-review
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
          enable-cache: true
      - run: uv sync --all-packages --all-groups --frozen
      - name: Format and verify Phase 4 Python
        run: |
          uv run ruff format \
            packages/application/src/auto_video_sub_application/subtitle_style.py \
            packages/application/tests/test_subtitle_style_service.py \
            packages/domain/src/auto_video_sub_domain/subtitle_style.py
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run mypy
          uv run pytest packages/domain/tests/test_subtitle_style.py packages/application/tests/test_subtitle_style_service.py apps/api/tests/test_health.py
      - name: Commit cleanup snapshot and remove helper workflow
        run: |
          rm .github/workflows/phase4-python-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/application/src/auto_video_sub_application/subtitle_style.py \
            packages/application/tests/test_subtitle_style_service.py \
            packages/domain/src/auto_video_sub_domain/subtitle_style.py \
            apps/api/src/auto_video_sub_api/subtitle_style_schemas.py \
            packages/infrastructure/src/auto_video_sub_infrastructure/__init__.py \
            .github/workflows/phase4-python-format.yml
          git commit -m "style: clean Phase 4 subtitle style code"
          git push origin HEAD:dev/translation-review
