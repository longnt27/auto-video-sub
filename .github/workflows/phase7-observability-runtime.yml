name: Phase 7 observability runtime

on:
  push:
    branches: [dev/observability-foundation]

permissions:
  contents: read

concurrency:
  group: phase7-observability-runtime
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Start observability services
        run: |
          docker compose --env-file .env.example \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml \
            up -d jaeger otel-collector prometheus grafana
      - name: Wait for observability services
        run: |
          set -euo pipefail
          compose=(
            docker compose --env-file .env.example
            -f deploy/compose.yaml
            -f deploy/compose.observability.yaml
          )

          dump_service() {
            local service="$1"
            echo "::group::${service} diagnostics"
            "${compose[@]}" ps -a "$service" || true
            "${compose[@]}" logs --no-color --tail=200 "$service" || true
            echo "::endgroup::"
          }

          assert_running() {
            local service="$1"
            local container_id
            local state
            container_id="$("${compose[@]}" ps -q "$service")"
            if [[ -z "$container_id" ]]; then
              echo "::error::$service has no container"
              dump_service "$service"
              return 1
            fi
            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            if [[ "$state" != "running" ]]; then
              echo "::error::$service container state is $state"
              dump_service "$service"
              return 1
            fi
          }

          wait_for() {
            local name="$1"
            local service="$2"
            local url="$3"
            for attempt in $(seq 1 45); do
              assert_running "$service"
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready at $url"
            dump_service "$service"
            return 1
          }

          assert_running otel-collector
          wait_for prometheus prometheus http://127.0.0.1:9090/-/ready
          wait_for grafana grafana http://127.0.0.1:3200/api/health
          wait_for jaeger-health jaeger http://127.0.0.1:13133/status
          wait_for jaeger-query jaeger http://127.0.0.1:16686/api/services
      - name: Emit metric and trace through OTLP
        run: |
          uv run python - <<'PY'
          from auto_video_sub_infrastructure.telemetry import configure_telemetry

          runtime = configure_telemetry(
              enabled=True,
              endpoint="http://127.0.0.1:4318",
              service_name="auto-video-sub-ci-probe",
              service_version="ci",
              environment="ci",
              sample_ratio=1.0,
              export_interval_seconds=5,
          )
          attrs = {
              "http.request.method": "GET",
              "http.response.status_code": "200",
          }
          with runtime.tracer.start_as_current_span("observability.runtime.probe"):
              runtime.http_requests.add(1, attrs)
              runtime.http_duration_ms.record(3.0, attrs)
          runtime.shutdown()
          PY
      - name: Verify Prometheus and Jaeger received telemetry
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            metrics="$(curl --fail --silent --get \
              --data-urlencode 'query=auto_video_sub_http_requests_total' \
              http://127.0.0.1:9090/api/v1/query)"
            services="$(curl --fail --silent http://127.0.0.1:16686/api/services)"
            if ! printf '%s' "$metrics" | grep -q '"result":\[\]' \
              && printf '%s' "$services" | grep -q 'auto-video-sub-ci-probe'; then
              echo "Prometheus and Jaeger received the CI probe"
              exit 0
            fi
            sleep 2
          done
          curl --silent --get \
            --data-urlencode 'query=auto_video_sub_http_requests_total' \
            http://127.0.0.1:9090/api/v1/query || true
          curl --silent http://127.0.0.1:16686/api/services || true
          docker compose --env-file .env.example \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml logs --no-color \
            jaeger otel-collector prometheus grafana
          exit 1
      - name: Validate provisioned Grafana dashboard
        run: |
          curl --fail --silent --user admin:local-observability-only \
            http://127.0.0.1:3200/api/dashboards/uid/auto-video-sub-api \
            | grep -q 'Auto Video Sub - API Overview'
      - name: Show service state
        if: always()
        run: |
          docker compose --env-file .env.example \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml ps -a || true
      - name: Stop observability services
        if: always()
        run: |
          docker compose --env-file .env.example \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml down -v || true
