name: Phase 6 stale render guard

on:
  push:
    branches: [dev/render-export]

permissions:
  contents: write

concurrency:
  group: phase6-stale-render-guard
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Apply stale-input guard
        run: python scripts/phase6_stale_guard.py
      - name: Verify Python candidate
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run mypy
          uv run pytest packages/domain/tests packages/providers/tests apps/api/tests apps/worker/tests
      - name: Commit guard and remove helper
        run: |
          rm scripts/phase6_stale_guard.py .github/workflows/phase6-stale-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(render): reject stale translated speech inputs"
          git push
