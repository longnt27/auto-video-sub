name: Phase 5 cleanup

on:
  push:
    branches: [dev/vietnamese-speech]

permissions:
  contents: write

concurrency:
  group: phase5-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
      - uses: pnpm/action-setup@v5
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate Python lock and format Python
        run: |
          uv lock
          uv sync --all-packages --all-groups --frozen
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff check .
          uv run mypy
      - name: Fix audio accessibility and verify web
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/speech-review.tsx")
          content = path.read_text(encoding="utf-8")
          old = '<audio src={segment.audio_url} controls preload="metadata" />'
          new = '''<audio src={segment.audio_url} controls preload="metadata">
                        <track
                          kind="captions"
                          src="/empty.vtt"
                          srcLang="vi"
                          label="Vietnamese speech transcript"
                        />
                      </audio>'''
          if old in content:
              path.write_text(content.replace(old, new), encoding="utf-8")
          elif "Vietnamese speech transcript" not in content:
              raise SystemExit("speech audio accessibility anchor not found")
          PY
          pnpm install --frozen-lockfile
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Remove helper and commit reproducibility outputs
        run: |
          rm .github/workflows/phase5-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(speech): refresh locks and formatting"
          git push
