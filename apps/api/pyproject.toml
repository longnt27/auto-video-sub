[project]
name = "auto-video-sub-api"
version = "0.1.0"
description = "FastAPI composition root for Auto Video Sub"
requires-python = ">=3.12,<3.13"
dependencies = [
  "auto-video-sub-application",
  "auto-video-sub-infrastructure",
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.40,<0.41",
]

[project.scripts]
auto-video-sub-api = "auto_video_sub_api.main:run"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"
